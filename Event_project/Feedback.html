<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="feedback.css">
    <title>Document</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <div class="container">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <input type="text" id="emailInput" placeholder="Enter your email">
        <textarea  id="messageInput" placeholder="Your message..." maxlength="100"></textarea>
        <p id="charCount">0 / 100</p>
        <button id="submitBtn">Submit</button>
    </div>
    <h2>Live Preview</h2>
    <div id="previewBox">
        <p><strong>Name:</strong> <span id="prevName">--</span></p>
        <p><strong>Email:</strong><span id="prevEmail">--</span></p>
        <p><strong>Message:</strong><span id="prevMsg">--</span></p>
    </div>
    <script src="feedback.js"></script>
</body>
</html>
